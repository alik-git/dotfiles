[project]
name = "ai-scratch"
version = "0.1.0"
description = "Shared, reproducible Python environment for Codex and Claude analysis tasks"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.12",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "ipython>=8.30",
    "matplotlib>=3.9",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "networkx>=3.4",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=11",
    "plotly>=5.24",
    "polars>=1.17",
    "pyarrow>=18",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "rich>=13.9",
    "rosbags>=0.10",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "sympy>=1.13",
    "tqdm>=4.67",
    "xlsxwriter>=3.2",
]

[tool.uv]
package = false
